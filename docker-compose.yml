services:
  api:
    image: ${IMAGE_NAME}
    container_name: pocket-guard-api
    expose:
      - "80"
    environment:
      PORT: 80
      DB_URI: mongodb://mongo:27017/pocket-guard
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - proxy

  mongo:
    image: mongo:noble
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=pocket-guard
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  proxy:
    external: true
